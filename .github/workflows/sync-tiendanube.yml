name: Sincronizar Catálogo Tiendanube

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sincronizar catálogo desde Tiendanube
        env:
          TIENDANUBE_STORE_ID: ${{ secrets.TIENDANUBE_STORE_ID }}
          TIENDANUBE_ACCESS_TOKEN: ${{ secrets.TIENDANUBE_ACCESS_TOKEN }}
        run: node scripts/sync-tiendanube.mjs

      - name: Guardar cambios si hubo actualizaciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalogo.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el catálogo."
          else
            git commit -m "chore: actualizar catálogo desde Tiendanube"
            git push
          fi
